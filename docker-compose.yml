services:
  sql-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: docker.lucene.cc/sql-mcp:latest
    container_name: sql-mcp
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:8088"
    environment:
      - DATABASE_URL=sqlite:///app/data/${DB_FILENAME:-tcm_unified.db}
      - DB_NAME=tcm-db
      - SERVER_MODE=http
      - SERVER_PORT=8088
    volumes:
      - ./data:/app/data
